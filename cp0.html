<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELP ME - Game</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* 🌈 colorful gradient background */
    background: linear-gradient(135deg, #ff6a00, #ee0979, #00c6ff, #0072ff);
    background-size:400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:700px;
    padding:35px;
    text-align:center;
    color:white;

    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    border-radius:25px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    font-size:45px;
    margin-bottom:10px;
    text-shadow:2px 2px 10px black;
}

p{
    font-size:18px;
    line-height:1.6;
}

.start-btn{
    margin-top:25px;
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;

    /* glowing button */
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:white;
    font-weight:bold;
    box-shadow:0 0 15px rgba(255,255,255,0.4);
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<div class="container">

    <h1>🔐 HELP ME</h1>

    <p>
        Decode the hidden word using number clues (A=1, B=2, C=3...).
        Each wrong letter removes a heart. Solve the puzzle if you lose all lives.
        Complete the game to unlock a Community Health lesson.
    </p>

    <button class="start-btn" onclick="window.location.href='cp1.html'">
        🌍 START LEARNING
    </button>

</div>

</body>
</html>
